name: FDS PDF Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Build PrintCraft baseline
        shell: pwsh
        run: |
          cargo build --release --locked -p printcraft

      - name: Verify EXE
        shell: pwsh
        run: |
          Get-Item target\release\printcraft.exe |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: fds-pdf-windows-x64-baseline
          path: target/release/printcraft.exe
          if-no-files-found: error
